# Shared protocol: IDENTICAL for every model and every regime (PDF requirement).
# Values marked "provisional" are final only after the benchmark (Houcine, scripts/benchmark.py) / EDA (Aymane).
# Two separate freezes: contract-v1 (interfaces, CONTRACT.md) and protocol-v1 (final values of this file).
# After tag contract-v1 this file changes only with the agreement of the 3 students.
seed: 42

data:
  root: data/cbis-ddsm                 # Kaggle awsaf49/cbis-ddsm-breast-cancer-image-dataset (folders csv/ and jpeg/)
  split_by: patient_id                 # never split by image (several views per patient)
  label_rule: malignant_if_any_lesion_malignant   # BENIGN + BENIGN_WITHOUT_CALLBACK -> benign
  manifest: results/manifest.csv       # one row per full mammogram + patient-level split + CV fold (committed)
  cache_dir: data/cache                # letterboxed resized images (git-ignored)
  dummy: false                         # true -> random images, no dataset needed (smoke tests, development)
  image_size: 224
  split: {train: 0.70, val: 0.15, test: 0.15}   # stratified, fixed seed
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]
  num_workers: 2                        # provisional until benchmark (per DataLoader; 0 on Windows if workers hang)
  class_imbalance: weighted_loss        # provisional until the EDA (classes are 1728 benign / 1375 malignant)

augmentation:                           # train split only
  hflip: 0.5
  rotation_deg: 10
  brightness: 0.1
  contrast: 0.1
  scale: [0.9, 1.0]

train:
  device: auto                          # provisional until benchmark: auto = CUDA if available, else CPU
  amp: false                            # provisional until benchmark: mixed precision, ON for everyone or OFF for everyone
  grad_accum: 1                         # provisional until benchmark: effective batch = batch_size * grad_accum, same for all
  optimizer: adamw
  lr_head: 1.0e-3
  lr_backbone: 1.0e-4                   # used in partial / full fine-tuning
  weight_decay: 1.0e-4
  batch_size: 16                        # provisional until benchmark
  epochs: 15                            # provisional until benchmark
  scheduler: cosine
  early_stopping_patience: 4            # on validation loss
  subset_fraction: 1.0                  # lower for full fine-tuning if too slow on the available hardware (document in paper)

regimes:
  extract: {unfreeze_stages: 0}
  partial: {unfreeze_stages: 1}         # last stage + head
  full:    {unfreeze_stages: all}

cv:
  folds: 5                              # provisional until benchmark (3 if too slow)

models:                                 # timm names, ImageNet pretrained
  xception: xception41                  # provisional: Fatima verifies the exact timm name / pretrained weights
  resnext101: resnext101_32x8d
  efficientnetv2: tf_efficientnetv2_s
  maxvit: maxvit_base_tf_224
  scratch_cnn: custom
